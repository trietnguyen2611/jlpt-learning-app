name: Build Windows app

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Package Windows executable
        run: >-
          pyinstaller --noconfirm --clean --onefile --windowed
          --name JLPTLearning --icon icon/app.ico
          --hidden-import webview.platforms.winforms
          --add-data "templates;templates" app.py

      - name: Create downloadable archive
        run: Compress-Archive -Path dist/JLPTLearning.exe -DestinationPath dist/JLPTLearning-Windows.zip

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: JLPTLearning-Windows
          path: dist/JLPTLearning-Windows.zip
          if-no-files-found: error
