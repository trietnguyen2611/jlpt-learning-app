name: Build macOS Apple Silicon app

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Confirm Apple Silicon runner
        run: test "$(uname -m)" = "arm64"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Package macOS app
        run: >-
          pyinstaller --noconfirm --clean --windowed
          --name JLPTLearning --icon icon/app.icns
          --hidden-import webview.platforms.cocoa
          --add-data "templates:templates" app.py

      - name: Create downloadable archive
        run: ditto -c -k --sequesterRsrc --keepParent dist/JLPTLearning.app dist/JLPTLearning-macOS-Apple-Silicon.zip

      - name: Upload macOS build
        uses: actions/upload-artifact@v4
        with:
          name: JLPTLearning-macOS-Apple-Silicon
          path: dist/JLPTLearning-macOS-Apple-Silicon.zip
          if-no-files-found: error
