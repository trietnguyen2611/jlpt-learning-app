name: Build and release desktop apps

on:
  push:
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag to build and publish
        required: true
        default: v1.0.0

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      VERSION: ${{ inputs.release_tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || github.sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Package Windows executable
        run: >-
          pyinstaller --noconfirm --clean --onefile --windowed
          --name JLPTLearning --icon icon/app.ico
          --hidden-import webview.platforms.winforms
          --add-data "templates;templates" app.py

      - name: Name Windows executable
        run: Copy-Item dist/JLPTLearning.exe "dist/JLPTLearning-Windows-$env:VERSION.exe"

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: JLPTLearning-Windows
          path: dist/JLPTLearning-Windows-${{ env.VERSION }}.exe
          if-no-files-found: error

  build-macos:
    runs-on: macos-15
    env:
      VERSION: ${{ inputs.release_tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || github.sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Confirm Apple Silicon runner
        run: test "$(uname -m)" = "arm64"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Package macOS app
        run: >-
          pyinstaller --noconfirm --clean --windowed
          --name JLPTLearning --icon icon/app.icns
          --hidden-import webview.platforms.cocoa
          --add-data "templates:templates" app.py

      - name: Create macOS disk image
        run: hdiutil create -volname "JLPT Learning" -srcfolder dist/JLPTLearning.app -ov -format UDZO "dist/JLPTLearning-macOS-Apple-Silicon-$VERSION.dmg"

      - name: Upload macOS build
        uses: actions/upload-artifact@v4
        with:
          name: JLPTLearning-macOS-Apple-Silicon
          path: dist/JLPTLearning-macOS-Apple-Silicon-${{ env.VERSION }}.dmg
          if-no-files-found: error

  release:
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || github.event_name == 'workflow_dispatch'
    needs:
      - build-windows
      - build-macos
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download Windows build
        uses: actions/download-artifact@v4
        with:
          name: JLPTLearning-Windows
          path: release-assets

      - name: Download macOS build
        uses: actions/download-artifact@v4
        with:
          name: JLPTLearning-macOS-Apple-Silicon
          path: release-assets

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view "$VERSION" >/dev/null 2>&1; then
            gh release create "$VERSION" \
              --verify-tag \
              --title "JLPT Learning App $VERSION" \
              --generate-notes
          fi
          gh release edit "$VERSION" --title "JLPT Learning App $VERSION"
          if gh release view "$VERSION" --json assets --jq '.assets[].name' | grep -Fxq "JLPT.Learning.App.exe"; then
            gh release delete-asset "$VERSION" "JLPT.Learning.App.exe" --yes
          fi
          gh release upload "$VERSION" release-assets/* --clobber
